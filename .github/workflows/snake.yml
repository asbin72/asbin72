name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C8FF00&color_dots=%231a1a1a,%233d4a0a,%235c7010,%238ca815,%23C8FF00&color_dot_border=%230D0D0D
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C8FF00&color_dots=%230D0D0D,%233d4a0a,%235c7010,%238ca815,%23C8FF00&color_dot_border=%230D0D0D

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
